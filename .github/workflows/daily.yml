name: Daily Reel
on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Video erzeugen
        run: python bot.py generate
        env:
          HANDLE: ${{ vars.HANDLE }}
      - name: Video ins Repo legen
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A videos history.json
          git commit -m "daily reel" || true
          git push
      - name: Auf Instagram posten
        if: ${{ vars.AUTO_PUBLISH == 'true' }}
        run: python bot.py publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
